<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: "Source Sans Pro", sans-serif; font-size: 14px; color: #3A3A3A; }
  .box { padding: 10px 12px; border-radius: 6px; background: #FAE5DC; border-left: 4px solid #F15A24; }
  .ok { background: #EAFAF1; border-left-color: #1E8449; }
  .err { background: #FDECEA; border-left-color: #C0392B; }
  .bar { height: 6px; background: #eee; border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .bar > div { height: 100%; background: #F15A24; width: 0%; transition: width .2s; }
</style>
</head>
<body>
<div id="status" class="box">Aguardando…</div>
<div class="bar"><div id="fill"></div></div>
<script>
/*
 * Executor dos Testes de API no NAVEGADOR de quem usa o app.
 * Motivo: WAFs (ex.: CloudFront do HML) bloqueiam IPs de provedores de nuvem
 * (Streamlit Cloud, n8n na Oracle), mas aceitam o IP do usuário. As chamadas
 * saem daqui e os resultados brutos voltam pro Python, que avalia as asserções.
 *
 * Protocolo do componente Streamlit implementado à mão (sem build):
 *   recebe  {type:"streamlit:render", args:{...}}
 *   envia   streamlit:componentReady / setFrameHeight / setComponentValue
 */
const RE_VAR = /\{\{\s*([\w.-]+)\s*\}\}/g;
const RE_VAR_G = /\{\{\s*([\w.-]+)\s*\}\}/g;
let ultimoRunId = null;

function send(type, data) { window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data), "*"); }
function setStatus(txt, cls) { const el = document.getElementById("status"); el.textContent = txt; el.className = "box " + (cls || ""); }
function setFill(p) { document.getElementById("fill").style.width = Math.round(p * 100) + "%"; }

function substituir(texto, vars) {
  if (!texto) return texto || "";
  return String(texto).replace(RE_VAR, (m, nome) => (nome in vars ? vars[nome] : m));
}
// Mesmo subconjunto de JSONPath do runner Python (ApiTestRunner.obter_caminho):
// a[0], a[-1], a[*], a.*, a['chave'], a[?(@.campo=='x')], a.length, prefixo $.
// Com [*]/filtro, a extração usa o primeiro valor encontrado.
function tokensCaminho(caminho) {
  let s = String(caminho || "").trim();
  if (s.startsWith("$")) s = s.slice(1);
  const tokens = [];
  let i = 0;
  while (i < s.length) {
    const c = s[i];
    if (c === ".") { if (s[i + 1] === ".") return null; i++; continue; }
    if (c === "[") {
      let j = i + 1, prof = 0, aspas = null;
      for (; j < s.length; j++) {
        const ch = s[j];
        if (aspas) { if (ch === aspas) aspas = null; }
        else if (ch === "'" || ch === '"') aspas = ch;
        else if (ch === "(" || ch === "[") prof++;
        else if (ch === ")" || ch === "]") { if (ch === "]" && prof === 0) break; prof--; }
      }
      if (j >= s.length) return null;
      const dentro = s.slice(i + 1, j).trim();
      let m;
      if (dentro === "*") tokens.push(["*"]);
      else if (/^-?\d+$/.test(dentro)) tokens.push(["idx", parseInt(dentro, 10)]);
      else if (dentro.length >= 2 && (dentro[0] === "'" || dentro[0] === '"') && dentro[dentro.length - 1] === dentro[0]) tokens.push(["key", dentro.slice(1, -1)]);
      else if ((m = dentro.match(/^\?\(\s*@\.([\w.\-]+)\s*(?:(==|!=)\s*(.+?))?\s*\)$/))) {
        let v = m[3] === undefined ? undefined : m[3].trim();
        if (v !== undefined) {
          if (v.length >= 2 && (v[0] === "'" || v[0] === '"') && v[v.length - 1] === v[0]) v = v.slice(1, -1);
          else if (v === "true" || v === "false") v = v === "true";
          else if (v === "null") v = null;
          else if (!isNaN(Number(v))) v = Number(v);
          else return null;
        }
        tokens.push(["filtro", m[1], m[2], v]);
      } else return null;
      i = j + 1;
      continue;
    }
    let j = i;
    while (j < s.length && s[j] !== "." && s[j] !== "[") j++;
    const nome = s.slice(i, j);
    tokens.push(nome === "*" ? ["*"] : nome === "length()" ? ["len"] : ["key", nome]);
    i = j;
  }
  return tokens;
}

function obterCaminho(dado, caminho) {
  if (!caminho) return dado;
  const tokens = tokensCaminho(caminho);
  if (!tokens) return undefined;
  let atuais = [dado], varios = false;
  for (const tok of tokens) {
    const prox = [];
    for (const atual of atuais) {
      if (tok[0] === "key") {
        if (atual && typeof atual === "object" && !Array.isArray(atual) && tok[1] in atual) prox.push(atual[tok[1]]);
        else if (tok[1] === "length" && (Array.isArray(atual) || typeof atual === "string")) prox.push(atual.length);
      } else if (tok[0] === "len") {
        if (Array.isArray(atual) || typeof atual === "string") prox.push(atual.length);
        else if (atual && typeof atual === "object") prox.push(Object.keys(atual).length);
      } else if (tok[0] === "idx") {
        if (Array.isArray(atual) && tok[1] >= -atual.length && tok[1] < atual.length) prox.push(atual[tok[1] < 0 ? atual.length + tok[1] : tok[1]]);
      } else if (tok[0] === "*") {
        varios = true;
        if (Array.isArray(atual)) prox.push(...atual);
        else if (atual && typeof atual === "object") prox.push(...Object.values(atual));
      } else if (tok[0] === "filtro") {
        varios = true;
        if (Array.isArray(atual)) for (const item of atual) {
          const o = obterCaminho(item, tok[1]);
          if (o === undefined) continue;
          const igual = o === tok[3] || String(o) === String(tok[3]);
          if (tok[2] === undefined ? !!o : (tok[2] === "==" ? igual : !igual)) prox.push(item);
        }
      }
    }
    atuais = prox;
    if (!atuais.length && !varios) return undefined;
  }
  return atuais.length ? atuais[0] : undefined;
}

async function executarCaso(caso, vars, timeoutMs) {
  const url = substituir(caso.url, vars);
  const headers = {};
  for (const [k, v] of Object.entries(caso.headers || {})) headers[k] = substituir(v, vars);
  const body = substituir(caso.body || "", vars);
  const metodo = (caso.metodo || "GET").toUpperCase();
  const t0 = performance.now();
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  const base = { case_id: caso.id, url_final: url, request_headers: headers, request_body: body };
  try {
    const opts = { method: metodo, headers, signal: ctrl.signal, redirect: "follow", mode: "cors" };
    if (body && !["GET", "HEAD"].includes(metodo)) opts.body = body;
    const r = await fetch(url, opts);
    const text = await r.text();
    const respHeaders = {};
    r.headers.forEach((v, k) => { respHeaders[k] = v; });
    return Object.assign(base, { status: r.status, status_text: r.statusText || "", response_headers: respHeaders, body: text, tempo_ms: Math.round(performance.now() - t0), erro: "" });
  } catch (e) {
    const msg = e.name === "AbortError" ? `tempo limite de ${Math.round(timeoutMs / 1000)}s excedido`
      : `${e.message || e}. Se a API não permitir CORS a partir do navegador, peça ao administrador para usar o modo "Servidor".`;
    return Object.assign(base, { status: null, status_text: "", response_headers: {}, body: "", tempo_ms: Math.round(performance.now() - t0), erro: msg });
  } finally { clearTimeout(timer); }
}

async function executar(args) {
  const casos = args.casos || [];
  const vars = Object.assign({}, args.variaveis || {});
  const timeoutMs = (args.timeout_s || 30) * 1000;
  const respostas = [];
  const produtores = {};   // variável -> nome do caso anterior que deveria extraí-la
  for (let i = 0; i < casos.length; i++) {
    const caso = casos[i];
    setStatus(`Executando ${i + 1}/${casos.length}: ${caso.nome}`); setFill(i / casos.length);
    // Mesma regra do runner Python: variável de caso anterior que ficou vazia
    // (extração falhou) bloqueia este caso em vez de mandar a URL quebrada.
    const usadas = new Set();
    for (const txt of [caso.url, caso.body].concat(Object.values(caso.headers || {}))) {
      for (const m of String(txt || "").matchAll(RE_VAR_G)) usadas.add(m[1]);
    }
    // Inclui variável sem valor que nenhum caso produz (preenchimento pendente):
    // bloqueia só os casos que a usam.
    const faltando = [...usadas].filter((n) => !String(vars[n] || "").trim());
    let r;
    if (faltando.length) {
      r = { case_id: caso.id, status: null, status_text: "", response_headers: {}, body: "", tempo_ms: 0, erro: "",
            bloqueado: "variável vazia: " + faltando.join(", ") };
    } else {
      r = await executarCaso(caso, vars, timeoutMs);
    }
    for (const ex of (caso.extrair || [])) if (ex.nome && !(ex.nome in produtores)) produtores[ex.nome] = caso.nome;
    // extração de variáveis pros próximos casos (mesma regra do runner Python)
    if (r.status !== null && caso.extrair && caso.extrair.length) {
      let json = null; try { json = JSON.parse(r.body); } catch (_) {}
      if (json !== null) for (const ex of caso.extrair) {
        const v = obterCaminho(json, substituir(ex.caminho, vars));
        if (v !== undefined) vars[ex.nome] = typeof v === "string" ? v : JSON.stringify(v);
      }
    }
    respostas.push(r);
  }
  setFill(1); setStatus(`Concluído: ${casos.length} caso(s) executado(s) a partir deste navegador. Enviando os resultados…`, "ok");
  send("streamlit:setComponentValue", { value: { run_id: args.run_id, respostas }, dataType: "json" });
}

window.addEventListener("message", (event) => {
  const data = event.data || {};
  if (data.type !== "streamlit:render") return;
  const args = data.args || {};
  if (!args.run_id || args.run_id === ultimoRunId) return;   // roda uma vez por execução
  ultimoRunId = args.run_id;
  executar(args).catch((e) => {
    setStatus("Falha inesperada: " + (e.message || e), "err");
    send("streamlit:setComponentValue", { value: { run_id: args.run_id, erro_geral: String(e.message || e), respostas: [] }, dataType: "json" });
  });
});
send("streamlit:componentReady", { apiVersion: 1 });
send("streamlit:setFrameHeight", { height: 70 });
</script>
</body>
</html>
